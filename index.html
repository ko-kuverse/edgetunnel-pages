<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>edgetunnel 静态页面</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #0b1020;
			color: #e6e9f2;
			font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
		}
		main { max-width: 720px; padding: 40px 24px; }
		h1 { font-size: 22px; margin: 0 0 16px; }
		code { background: #1a2340; padding: 2px 6px; border-radius: 4px; color: #9fc4ff; }
		p { margin: 10px 0; color: #b7bfd4; }
		.warn { color: #ffcf7a; }
	</style>
</head>
<body>
	<main>
		<h1>edgetunnel 静态页面</h1>
		<p>这个仓库只用于给 Cloudflare Worker 提供 <code>/login</code>、<code>/admin</code>、<code>/noADMIN</code>、<code>/noKV</code> 四个页面。</p>
		<p>请通过你的 Worker 域名访问，例如 <code>https://你的域名/admin</code>。</p>
		<p class="warn">直接在这个 GitHub Pages 地址上打开 admin/ 或 login/ 无法登录后台：页面里的接口请求会回到你自己的 Worker 域名。</p>
	</main>
</body>
</html>
